<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7579ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-18px) translateX(12px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite reverse; }
    .data-flow-1 { stroke-dasharray: 12, 12; animation: flowLine 12s linear infinite; }
    .data-flow-2 { stroke-dasharray: 8, 8; animation: flowLine 8s linear infinite reverse; }
    .badge-float-1 { animation: badgeHover 5s ease-in-out infinite; }
    .badge-float-2 { animation: badgeHover 6s ease-in-out 1s infinite; }
    .badge-float-3 { animation: badgeHover 5.5s ease-in-out 2s infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Background Orbs -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#0284c7"/>
    <circle class="orb-2" cx="1020" cy="310" r="160" fill="#7c3aed"/>
    <circle class="orb-1" cx="600" cy="380" r="100" fill="#0d9488"/>
  </g>

  <!-- High-Tech Grid Matrix -->
  <g stroke="url(#gridGrad)" stroke-width="1" opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Dynamic Circuit / Data Highway Streams -->
  <g fill="none" opacity="0.5">
    <path class="data-flow-1" d="M -50 110 Q 300 40, 600 110 T 1250 110" stroke="#38bdf8" stroke-width="2"/>
    <path class="data-flow-2" d="M -50 340 Q 300 270, 600 340 T 1250 340" stroke="#a855f7" stroke-width="2"/>
    <path class="data-flow-1" d="M 100 -20 Q 350 210, 600 210 T 1100 440" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Ambient Dynamic Floating Data Nodes -->
  <g class="particle-1" fill="#38bdf8" opacity="0.6">
    <circle cx="120" cy="180" r="3"/>
    <circle cx="280" cy="80" r="2.5"/>
    <circle cx="950" cy="100" r="3.5"/>
    <circle cx="1110" cy="220" r="2"/>
  </g>
  <g class="particle-2" fill="#c084fc" opacity="0.6">
    <circle cx="200" cy="320" r="3"/>
    <circle cx="450" cy="60" r="2"/>
    <circle cx="820" cy="360" r="3"/>
    <circle cx="1060" cy="80" r="2.5"/>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed Crisp & High-Contrast) -->
  <g id="foreground-content">
    <!-- Top Category Pill / Micro-badge -->
    <g transform="translate(430, 48)">
      <rect x="0" y="0" width="340" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21" class="font-mono" font-size="12" fill="#93c5fd" letter-spacing="1">AWESOME ECOSYSTEM REGISTRY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="font-title" font-size="44" fill="url(#textGrad)" filter="url(#glowFilter)" letter-spacing="-0.5">
      Data Cloud Native App Deployment
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="195" text-anchor="middle" class="font-sub" font-size="19" fill="url(#subGrad)" letter-spacing="0.2">
      Curated Catalog of Data-Native Frameworks, Marketplaces, IDPs &amp; Streamlit/Lakehouse Apps
    </text>

    <!-- Feature Ecosystem Cards / Pills -->
    <g transform="translate(130, 240)">
      <!-- Card 1: Data Cloud Native Apps -->
      <g class="badge-float-1" transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="64" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
        <text x="20" y="27" class="font-title" font-size="13" fill="#38bdf8">❄️ DATA PLATFORMS</text>
        <text x="20" y="48" class="font-sub" font-size="12" fill="#94a3b8">Snowflake • Databricks</text>
      </g>

      <!-- Card 2: Cloud Marketplaces -->
      <g class="badge-float-2" transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="64" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
        <text x="20" y="27" class="font-title" font-size="13" fill="#818cf8">☁️ CLOUD MARKETPLACES</text>
        <text x="20" y="48" class="font-sub" font-size="12" fill="#94a3b8">AWS • GCP • Azure • Stripe</text>
      </g>

      <!-- Card 3: Open-Source IDPs -->
      <g class="badge-float-3" transform="translate(490, 0)">
        <rect x="0" y="0" width="210" height="64" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
        <text x="20" y="27" class="font-title" font-size="13" fill="#c084fc">⚡ DEVELOPER PORTALS</text>
        <text x="20" y="48" class="font-sub" font-size="12" fill="#94a3b8">Backstage • OpenChoreo</text>
      </g>

      <!-- Card 4: Open Data Apps -->
      <g class="badge-float-1" transform="translate(730, 0)">
        <rect x="0" y="0" width="210" height="64" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
        <text x="20" y="27" class="font-title" font-size="13" fill="#34d399">🚀 OPEN DATA ENGINES</text>
        <text x="20" y="48" class="font-sub" font-size="12" fill="#94a3b8">Streamlit • Superset • Cube</text>
      </g>
    </g>

    <!-- Bottom Tagline / Meta Status -->
    <g transform="translate(600, 370)">
      <text text-anchor="middle" class="font-mono" font-size="12" fill="#64748b" letter-spacing="1.5">
        ENTERPRISE DEPLOYMENT ARCHITECTURES • SELF-HOSTED IDPs • EMBEDDED INTEGRATIONS
      </text>
    </g>
  </g>
</svg>
