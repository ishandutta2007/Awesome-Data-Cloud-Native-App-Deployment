<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".1"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#1e293b" stop-opacity=".1"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><linearGradient id="purpleGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b224ef" stop-opacity=".8"/><stop offset="100%" stop-color="#7579ff" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".7"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="25"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(25px,-15px);opacity:.65}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(12px)}}@keyframes flowLine{0%{stroke-dashoffset:240}}@keyframes badgeHover{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800}.font-sub{font-weight:500}.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 300px}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite reverse}.data-flow-1{stroke-dasharray:12,12;animation:flowLine 12s linear infinite}.data-flow-2{stroke-dasharray:8,8;animation:flowLine 8s linear infinite reverse}.badge-float-1{animation:badgeHover 5s ease-in-out infinite}.badge-float-2{animation:badgeHover 6s ease-in-out 1s infinite}.badge-float-3{animation:badgeHover 5.5s ease-in-out 2s infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><g filter="url(#softGlow)"><circle cx="180" cy="90" r="140" fill="#0284c7" class="orb-1"/><circle cx="1020" cy="310" r="160" fill="#7c3aed" class="orb-2"/><circle cx="600" cy="380" r="100" fill="#0d9488" class="orb-1"/></g><g stroke="url(#gridGrad)" stroke-width="1" opacity=".35"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="150" x2="150" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="450" x2="450" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="750" x2="750" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1050" x2="1050" y1="0" y2="420"/></g><g fill="none" opacity=".5"><path stroke="#38bdf8" stroke-width="2" d="M -50 110 Q 300 40, 600 110 T 1250 110" class="data-flow-1"/><path stroke="#a855f7" stroke-width="2" d="M -50 340 Q 300 270, 600 340 T 1250 340" class="data-flow-2"/><path stroke="#06b6d4" stroke-opacity=".4" stroke-width="1.5" d="M 100 -20 Q 350 210, 600 210 T 1100 440" class="data-flow-1"/></g><g fill="#38bdf8" class="particle-1" opacity=".6"><circle cx="120" cy="180" r="3"/><circle cx="280" cy="80" r="2.5"/><circle cx="950" cy="100" r="3.5"/><circle cx="1110" cy="220" r="2"/></g><g fill="#c084fc" class="particle-2" opacity=".6"><circle cx="200" cy="320" r="3"/><circle cx="450" cy="60" r="2"/><circle cx="820" cy="360" r="3"/><circle cx="1060" cy="80" r="2.5"/></g><g id="foreground-content"><g transform="translate(430, 48)"><rect width="340" height="32" x="0" y="0" fill="#0f172a" fill-opacity=".85" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="16"/><circle cx="18" cy="16" r="5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/></circle><text x="32" y="21" fill="#93c5fd" class="font-mono" font-size="12" letter-spacing="1">AWESOME ECOSYSTEM REGISTRY</text></g><text x="600" y="145" fill="url(#textGrad)" class="font-title" filter="url(#glowFilter)" font-size="44" letter-spacing="-.5" text-anchor="middle">Data Cloud Native App Deployment</text><text x="600" y="195" fill="url(#subGrad)" class="font-sub" font-size="19" letter-spacing=".2" text-anchor="middle">Curated Catalog of Data-Native Frameworks, Marketplaces, IDPs &amp; Streamlit/Lakehouse Apps</text><g><g class="badge-float-1" transform="translate(130, 240) translate(0, 0)"><rect width="210" height="64" x="0" y="0" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="12"/><text x="20" y="27" fill="#38bdf8" class="font-title" font-size="13">❄️ DATA PLATFORMS</text><text x="20" y="48" fill="#94a3b8" class="font-sub" font-size="12">Snowflake • Databricks</text></g><g cla